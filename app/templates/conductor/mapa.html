<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa - Parquéate Cerca</title>

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Fuentes: Manrope para títulos, Inter para el cuerpo de texto -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mapa.css') }}">
</head>

<body>

    <!-- ── Navbar superior ─────────────────────────────────────────────────── -->
    <header class="navbar-custom">
        <div class="d-flex align-items-center flex-grow-1 gap-3">
            <button class="nav-icon-btn" id="toggleSidebar" title="Menú de navegación">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <a href="/" class="navbar-brand-custom">Parquéate Cerca</a>
        </div>

        <button type="button" class="nav-chip-btn" id="btnRegistrarParqueadero" title="Registrar mi parqueadero">
            <span class="material-symbols-outlined">add_business</span>
            <span id="txtBotonParqueadero">Registrar parqueadero</span>
        </button>
    </header>

    <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <img src="" alt="Avatar" class="sidebar-avatar" id="sidebarAvatar" />
            <div class="profile-info">
                <div class="profile-name" id="sidebarName">Cargando...</div>
                <div class="profile-role">Conductor</div>
            </div>
        </div>

        <nav class="sidebar-nav-container">
            <a href="/conductor/mapa" class="nav-item active">
                <span class="material-symbols-outlined">map</span>
                <span class="nav-text">Mapa</span>
            </a>
            <a href="/conductor/vehiculos" class="nav-item">
                <span class="material-symbols-outlined">directions_car</span>
                <span class="nav-text">Mis Vehículos</span>
            </a>
            <a href="/conductor/perfil?accion=cambiar-contrasena" class="nav-item">
                <span class="material-symbols-outlined">lock_reset</span>
                <span class="nav-text">Cambiar Contraseña</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="/conductor/perfil" class="nav-item">
                <span class="material-symbols-outlined">person</span>
                <span class="nav-text">Mi Perfil</span>
            </a>
            <a href="/login" class="nav-item nav-logout" id="btnLogout">
                <span class="material-symbols-outlined">logout</span>
                <span class="nav-text">Cerrar Sesión</span>
            </a>
        </div>

    </aside>

    <!-- ── Contenido principal ─────────────────────────────────────────────── -->
    <main class="main-content" id="mainContent">

        <!-- RF_17: Alerta de ubicación desactivada o denegada -->
        <div id="alertaUbicacion" class="alerta-ubicacion d-none">
            <span class="material-symbols-outlined">location_off</span>
            <div>
                <strong>Ubicación desactivada.</strong>
                Activa la geolocalización en tu navegador para usar el mapa.
            </div>
            <button id="btnReintentar" type="button">Reintentar</button>
        </div>

        <!-- RF_18: Contenedor del mapa interactivo -->
        <div id="map"></div>

        <!-- Botón para quitar la ruta trazada, visible solo cuando hay una activa -->
        <button type="button" id="btnQuitarRuta" class="btn-quitar-ruta d-none" title="Quitar ruta">
            <span class="material-symbols-outlined">close</span>
            Quitar ruta
        </button>

        <!-- Buscador de parqueaderos por nombre -->
        <div class="buscador-mapa">
            <span class="material-symbols-outlined buscador-icono">search</span>
            <input type="text" id="inputBuscarParqueadero" class="buscador-input" placeholder="Buscar parqueadero..."
                autocomplete="off">
            <button type="button" id="btnLimpiarBusqueda" class="buscador-limpiar d-none" title="Limpiar búsqueda">
                <span class="material-symbols-outlined">close</span>
            </button>
            <div id="resultadosBusqueda" class="buscador-resultados d-none"></div>
        </div>

        <!-- Botón flotante para recentrar el mapa en la ubicación del usuario -->
        <button type="button" id="btnCentrarUbicacion" class="btn-centrar-ubicacion" title="Centrar en mi ubicación">
            <span class="material-symbols-outlined">my_location</span>
        </button>


        <!-- RF_18: Card de preview del parqueadero al hacer clic en un marcador -->
        <div id="parkingPreviewCard" class="parking-preview d-none">
            <button type="button" id="btnCerrarPreview" class="preview-close">
                <span class="material-symbols-outlined">close</span>
            </button>

            <div class="preview-body">
                <div class="preview-icono">
                    <span class="material-symbols-outlined">local_parking</span>
                </div>
                <div class="preview-info">
                    <h6 class="preview-nombre" id="previewNombre">—</h6>
                    <div class="preview-meta">
                        <span id="previewCupos">—</span>
                        <span class="preview-separador">•</span>
                        <span id="previewDistancia">—</span>
                    </div>
                </div>
            </div>

            <div class="preview-acciones">
                <button type="button" id="btnComoLlegar" class="btn-como-llegar">
                    <span class="material-symbols-outlined">directions</span>
                    Cómo llegar
                </button>
                <a href="#" id="btnVerDetalles" class="btn-ver-detalles">
                    Ver detalles
                    <span class="material-symbols-outlined">arrow_forward</span>
                </a>
            </div>
        </div>

    </main>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="{{ url_for('static', filename='js/mapa.js') }}"></script>

</body>

</html>
